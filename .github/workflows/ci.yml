name: CI Pipeline
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements/train.txt -r requirements/serve.txt pytest
      - run: pytest tests/
